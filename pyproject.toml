[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bijan"
version = "0.1.0"
description = "Utilities for managing BIJAN (Beyond Bond Boston) volunteer data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = [
    "pandas",
    "numpy",
    "beautifulsoup4",
]

[project.urls]
Homepage = "https://github.com/alecw/BIJAN"

[project.scripts]
bijan-format-court-list = "bijan.format_court_list:main"
bijan-make-group-upload-csv = "bijan.make_group_upload_csv:main"
bijan-make-letter-writer-community-upload = "bijan.make_letter_writer_community_upload:main"
bijan-convert-google-airtable-volunteers = "bijan.convert_google_airtable_volunteers:main"

[tool.setuptools]
package-dir = { "bijan" = "src/python" }
packages = ["bijan"]
